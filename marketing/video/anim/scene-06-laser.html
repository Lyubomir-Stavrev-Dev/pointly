<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Pointly — Laser</title>
<link rel="stylesheet" href="shared.css">
<style>
/* Duration: 5.0s */
body { background: #0e0e18; }

.slide {
  position: absolute; inset: 0;
  background: #0e0e18;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 160px;
}
.slide-eyebrow {
  font-size: 14px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase;
  background: linear-gradient(90deg,#F4644D,#FF8C42);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 22px; align-self: flex-start;
}
.slide-title {
  font-size: 68px; font-weight: 800; color: #fff; letter-spacing: -2px;
  line-height: 1.05; margin-bottom: 56px; align-self: flex-start;
}
.slide-title span {
  background: linear-gradient(135deg,#F4644D,#FF8C42);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

.bullets { width: 100%; display: flex; flex-direction: column; gap: 20px; }
.bullet {
  display: flex; align-items: center; gap: 22px;
  padding: 24px 32px; border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
}
.bullet-num {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  background: rgba(244,100,77,0.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #F4644D;
}
.bullet-text { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.88); }

/* Laser cursor: glowing red dot */
.cursor {
  width: 18px; height: 18px;
  background: #ff3a3a;
  box-shadow: 0 0 0 5px rgba(255,58,58,0.3), 0 0 24px rgba(255,58,58,0.9), 0 0 48px rgba(255,58,58,0.4);
  animation: laser-pulse 0.8s ease-in-out infinite;
}
@keyframes laser-pulse {
  0%,100% { box-shadow: 0 0 0 5px rgba(255,58,58,0.3), 0 0 24px rgba(255,58,58,0.9), 0 0 48px rgba(255,58,58,0.35); }
  50%      { box-shadow: 0 0 0 8px rgba(255,58,58,0.18), 0 0 36px rgba(255,58,58,0.7), 0 0 70px rgba(255,58,58,0.25); }
}

/* SVG laser trail */
.laser-trail { position: absolute; inset: 0; width:100%; height:100%; pointer-events:none; z-index:30; overflow:visible; }
</style>
</head>
<body>

<div class="slide">
  <div class="slide-eyebrow">Roadmap · Q4 2024</div>
  <div class="slide-title">What's<br>coming <span>next</span></div>

  <div class="bullets">
    <div class="bullet" id="b1">
      <div class="bullet-num">01</div>
      <div class="bullet-text">Collaborative annotation — draw with your whole team live</div>
    </div>
    <div class="bullet" id="b2">
      <div class="bullet-num">02</div>
      <div class="bullet-text">AI-powered spotlight — highlights automatically on your behalf</div>
    </div>
    <div class="bullet" id="b3">
      <div class="bullet-num">03</div>
      <div class="bullet-text">Recording mode — capture annotated sessions as shareable clips</div>
    </div>
  </div>
</div>

<!-- SVG trail overlay -->
<svg class="laser-trail" id="trail-svg">
  <defs>
    <linearGradient id="laser-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3a3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff3a3a" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <path id="trail" d="" stroke="url(#laser-grad)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.65"/>
</svg>

<!-- Toolbar — laser active -->
<div class="toolbar">
  <div class="tb-handle"><i></i><i></i><i></i></div>
  <div class="tb-mode" style="background:linear-gradient(135deg,#ff4444,#ff8c42);box-shadow:0 8px 22px -4px rgba(255,68,68,0.55);">
    <svg viewBox="0 0 24 24" width="12" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg>
    Laser
  </div>
  <div class="tb-lbl">Tools</div>
  <div class="tb-grid">
    <div class="tb-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>
    <div class="tb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18h10M6 13l6-6 5 5-6 6H6v-5z"/></svg></div>
    <div class="tb-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg></div>
    <div class="tb-btn on lock"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/></svg></div>
    <div class="tb-btn lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
    <div class="tb-btn lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v6M6 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM18 13a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM18 15V9"/></svg></div>
  </div>
  <div class="tb-div"></div>
  <div class="tb-swatches">
    <div class="sw on" style="background:#ff4444"></div>
    <div class="sw" style="background:#FF8C42"></div>
    <div class="sw" style="background:#FFD166"></div>
    <div class="sw" style="background:#34D399"></div>
    <div class="sw" style="background:#4FACFE"></div>
    <div class="sw" style="background:#A78BFA"></div>
    <div class="sw" style="background:#E9458C"></div>
    <div class="sw" style="background:#fff"></div>
  </div>
</div>

<div class="cursor" id="cursor"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cursor   = document.getElementById('cursor');
  const trailEl  = document.getElementById('trail');
  const trailSvg = document.getElementById('trail-svg');

  const b1 = document.getElementById('b1').getBoundingClientRect();
  const b2 = document.getElementById('b2').getBoundingClientRect();
  const b3 = document.getElementById('b3').getBoundingClientRect();

  // Waypoints: hover each bullet number
  const waypoints = [
    { x: b1.left + 52, y: b1.top + b1.height/2 },
    { x: b2.left + 52, y: b2.top + b2.height/2 },
    { x: b3.left + 52, y: b3.top + b3.height/2 },
    { x: b3.right - 80, y: b3.top + b3.height/2 }, // sweep to end
  ];

  // Trail: ring buffer of last N positions
  const TRAIL_LEN = 60;
  const history = [];
  let wpIdx = 0;
  let curX = waypoints[0].x, curY = waypoints[0].y;

  cursor.style.left = curX + 'px';
  cursor.style.top  = curY + 'px';
  cursor.style.opacity = '1';

  // Highlight bullets one by one
  const bullets = [b1, b2, b3].map(r => {
    const hl = document.createElement('div');
    hl.style.cssText = `
      position:absolute; z-index:10; pointer-events:none;
      left:${r.left}px; top:${r.top}px; width:${r.width}px; height:${r.height}px;
      border-radius:16px; background:rgba(255,58,58,0.12);
      border: 1.5px solid rgba(255,58,58,0.3);
      opacity:0; transition: opacity 0.3s ease;
    `;
    document.body.appendChild(hl);
    return hl;
  });

  function easeIO(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function moveTo(targetX, targetY, dur, delay, cb) {
    const sx = curX, sy = curY;
    setTimeout(() => {
      const t0 = performance.now();
      function frame(now) {
        const t = Math.min((now - t0) / dur, 1);
        const e = easeIO(t);
        curX = sx + (targetX - sx) * e;
        curY = sy + (targetY - sy) * e;
        cursor.style.left = curX + 'px';
        cursor.style.top  = curY + 'px';

        // Update trail
        history.push({ x: curX, y: curY });
        if (history.length > TRAIL_LEN) history.shift();
        if (history.length > 1) {
          const pts = history.map((p,i) => `${i===0?'M':'L'}${p.x} ${p.y}`).join(' ');
          trailEl.setAttribute('d', pts);
        }

        if (t < 1) requestAnimationFrame(frame);
        else if (cb) cb();
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  // Sequence: move to each bullet, highlight it, pause
  const pauseMs = 700;
  moveTo(waypoints[0].x, waypoints[0].y, 400, 300, () => {
    bullets[0].style.opacity = '1';
    moveTo(waypoints[1].x, waypoints[1].y, 900, pauseMs, () => {
      bullets[0].style.opacity = '0';
      bullets[1].style.opacity = '1';
      moveTo(waypoints[2].x, waypoints[2].y, 900, pauseMs, () => {
        bullets[1].style.opacity = '0';
        bullets[2].style.opacity = '1';
        // Sweep across the last bullet text
        moveTo(waypoints[3].x, waypoints[3].y, 1200, pauseMs, () => {
          bullets[2].style.opacity = '0';
        });
      });
    });
  });
});
</script>
</body>
</html>
